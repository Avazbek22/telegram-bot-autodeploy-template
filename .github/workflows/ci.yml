name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - name: Import-safe smoke test
        run: python -c "import main, threading; assert len(threading.enumerate()) == 1"

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh tests/shell/*.sh
      - name: Deployment shell tests
        run: bash tests/shell/test-deploy.sh
      - name: Docker Compose configuration
        run: |
          test ! -e .env
          ENV_FILE=.env-example APP_SLUG=ci-telegram-bot docker compose config --quiet
          test ! -e .env
      - name: Build production image
        run: docker build --tag telegram-bot-template:ci .
      - name: Verify image UID and excluded secrets
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' telegram-bot-template:ci)" = "10001:10001"
          docker run --rm --entrypoint sh telegram-bot-template:ci -ec \
            'test "$(id -u):$(id -g)" = "10001:10001"; test ! -e /app/.env'
      - name: Verify image healthcheck and import safety
        run: |
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' telegram-bot-template:ci)" \
            = '["CMD","python","-m","app.healthcheck"]'
          docker run --rm --entrypoint python telegram-bot-template:ci -c \
            "import main, threading; assert len(threading.enumerate()) == 1"
      - name: Verify read-only root filesystem
        run: |
          docker run --rm --read-only --user 0 --entrypoint sh telegram-bot-template:ci \
            -ec '! touch /root-filesystem-must-be-read-only 2>/dev/null'
