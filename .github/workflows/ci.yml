name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - name: Import-safe smoke test
        run: python -c "import main, threading; assert len(threading.enumerate()) == 1"

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh tests/shell/*.sh
      - name: Deployment shell tests
        run: bash tests/shell/test-deploy.sh
      - name: Docker Compose configuration
        run: |
          cp .env-example .env
          sed -i 's/^BOT_TOKEN=.*/BOT_TOKEN=123456789:abcdefghijklmnopqrstuvwxyzABCDE/' .env
          APP_SLUG=ci-telegram-bot docker compose config --quiet
      - name: Build production image
        run: docker build --tag telegram-bot-template:ci .
      - name: Verify image UID and excluded secrets
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' telegram-bot-template:ci)" = "10001:10001"
          docker run --rm --entrypoint sh telegram-bot-template:ci -ec \
            'test "$(id -u):$(id -g)" = "10001:10001"; test ! -e /app/.env'
      - name: Verify read-only root filesystem
        run: |
          docker run --rm --read-only --user 0 --entrypoint sh telegram-bot-template:ci \
            -ec '! touch /root-filesystem-must-be-read-only 2>/dev/null'
